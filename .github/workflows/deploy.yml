name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".planning/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-infrabox667
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/simlf/music-learn-api
  IMAGE_WEB: ghcr.io/simlf/music-learn-web

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Decide whether gate tests can be skipped
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          skip=false
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            merge_tree=$(git rev-parse 'HEAD^{tree}')
            pr_head_tree=$(git rev-parse 'HEAD^2^{tree}')
            if [ "$merge_tree" = "$pr_head_tree" ]; then
              pr_head_sha=$(git rev-parse HEAD^2)
              conclusion=$(gh api "repos/$REPO/commits/$pr_head_sha/check-runs" --jq '[.check_runs[] | select(.name == "test") | .conclusion] | first')
              if [ "$conclusion" = "success" ]; then
                skip=true
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Gate skip decision: $skip"
      - uses: actions/setup-node@v4
        if: steps.decide.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
        if: steps.decide.outputs.skip != 'true'
      - run: npm run test
        if: steps.decide.outputs.skip != 'true'
      - run: npm run check
        if: steps.decide.outputs.skip != 'true'
      - working-directory: server
        run: npm ci
        if: steps.decide.outputs.skip != 'true'
      - working-directory: server
        run: npm run test
        if: steps.decide.outputs.skip != 'true'

  build-push:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VITE_API_BASE_URL=/api
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: read
    steps:
      - name: Deploy on infrabox667 over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/music-learn
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sudo docker compose -f docker-compose.prod.yml pull
            sudo docker logout ghcr.io
            sudo docker compose -f docker-compose.prod.yml up -d
            sudo docker image prune -f
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space on the server if deploy failed
        if: ${{ failure() }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo docker system prune -af
            df -h /
