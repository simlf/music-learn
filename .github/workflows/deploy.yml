name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".planning/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/simlf/music-learn-api
  IMAGE_WEB: ghcr.io/simlf/music-learn-web

jobs:
  # No-op gate held by the `main-debounce` environment's 10-minute wait timer
  # (no runner minutes spent while waiting). A newer merge cancels a run still
  # waiting here, so a burst deploys once, for the last one. See README "CI cost".
  debounce:
    runs-on: ubuntu-latest
    environment: main-debounce
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-debounce
      cancel-in-progress: true
    permissions: {}
    steps:
      - run: echo ok

  gate:
    needs: debounce
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Decide whether gate tests can be skipped
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          skip=false
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            merge_tree=$(git rev-parse 'HEAD^{tree}')
            pr_head_tree=$(git rev-parse 'HEAD^2^{tree}')
            if [ "$merge_tree" = "$pr_head_tree" ]; then
              pr_head_sha=$(git rev-parse HEAD^2)
              conclusion=$(gh api "repos/$REPO/commits/$pr_head_sha/check-runs" --jq '[.check_runs[] | select(.name == "test") | .conclusion] | first')
              if [ "$conclusion" = "success" ]; then
                skip=true
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Gate skip decision: $skip"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.decide.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
        if: steps.decide.outputs.skip != 'true'
      - run: npm run test
        if: steps.decide.outputs.skip != 'true'
      - run: npm run check
        if: steps.decide.outputs.skip != 'true'
      - working-directory: server
        run: npm ci
        if: steps.decide.outputs.skip != 'true'
      - working-directory: server
        run: npm run test
        if: steps.decide.outputs.skip != 'true'

  # Once past the debounce, a running build or deploy is never cancelled; each
  # has its own group, where a newer pending job may replace an older one.
  build-push:
    needs: gate
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./server
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          build-args: |
            VITE_API_BASE_URL=/api
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-deploy
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Skip if a newer commit on main supersedes this one
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          deploy=true
          if [ "$EVENT" = "push" ]; then
            newer=$(gh api "repos/$REPO/compare/$SHA...main" --jq '[.files[].filename | select(test("\\.md$|^\\.planning/|^docs/") | not)] | length')
            if [ "$newer" != "0" ]; then
              echo "newer commit on main, skipping"
              deploy=false
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      # SSH on the server is reachable only from the tailnet, so the runner
      # joins it as an ephemeral node for this job. Needs secrets
      # TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET from a Tailscale OAuth client
      # (auth_keys scope) that owns tag:ci-deploy; see docs/DEPLOY.md.
      - name: Join the tailnet
        if: steps.newest.outputs.deploy == 'true'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-deploy

      - name: Deploy on infrabox667 over SSH
        if: steps.newest.outputs.deploy == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/music-learn
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sudo docker compose -f docker-compose.prod.yml pull
            sudo docker logout ghcr.io
            sudo docker compose -f docker-compose.prod.yml up -d
            sudo docker image prune -f
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space on the server if deploy failed
        if: ${{ failure() && steps.newest.outputs.deploy == 'true' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo docker system prune -af
            df -h /
