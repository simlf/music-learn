name: visual

# Rendered-UI verification: phone layout, tap-target sizes, WCAG contrast, and
# deterministic entry into every drill surface. Runs real Chromium against the
# production build. See docs/VISUAL-VERIFICATION.md.
#
# Deliberately a separate workflow rather than another job in ci.yml: this one
# needs a browser download and a full `npm run build`, so keeping it apart lets
# the fast unit/type checks report independently.

on:
  # PR-only: main already ran this on the PR, so push-to-main runs only deploy.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      # --with-deps pulls the shared libraries headless Chromium needs on a
      # bare ubuntu runner; the local script omits it since macOS does not.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The suite's own webServer runs `npm run build` before serving build/,
      # so there is no separate build step here.
      #
      # `test:e2e` runs `svelte-kit sync` first. That is load-bearing on a fresh
      # runner: tsconfig.json extends $app/tsconfig, which only
      # exists after sync, and Playwright loads tsconfig before it ever starts
      # the webServer. Without it the run dies with "Failed to resolve extends
      # path". It passed locally only because sync had already run.
      - name: Visual checks
        run: npm run test:e2e

      # Screenshots and traces are how a human reviews what changed without
      # holding a phone. Only useful when something failed or a layout moved.
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-artifacts
          path: |
            screenshots/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
