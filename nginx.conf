server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prerendered SvelteKit pages: try the path, then <path>.html, then dir index.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Reverse-proxy API calls to the api service on the compose network.
    # Strip the /api prefix: /api/answers -> api:8080/answers.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
