server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prerendered SvelteKit pages: try the path, then <path>.html, then dir index.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Reverse-proxy API calls to the api service on the compose network.
    # Resolve the upstream lazily via Docker's embedded DNS (127.0.0.11) using
    # a variable in proxy_pass, so nginx still boots (and keeps serving the
    # static site) when the api container is down — /api just returns 502.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
