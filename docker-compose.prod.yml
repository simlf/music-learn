# Production stack for infrabox667. Images are pulled from GHCR (built by
# .github/workflows/deploy.yml), not built on the VM. The api service is not
# published to the host; it is reached only via the web container's /api proxy.
services:
  api:
    image: ghcr.io/simlf/music-learn-api:${IMAGE_TAG:-latest}
    env_file:
      - path: ./.env
        required: false
    environment:
      DB_PATH: /data/music-learn.db
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: ghcr.io/simlf/music-learn-web:${IMAGE_TAG:-latest}
    ports:
      - '${WEB_PORT:-8090}:80'
    depends_on:
      - api
    restart: unless-stopped
