<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 015 — Icon Tab Bar</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  body { margin:0; background:#ddd8ca; font-family:var(--font-sans); color:var(--color-ink); padding-top:56px; }
  #variant-nav { position:fixed; top:0; left:0; right:0; z-index:9998; background:var(--color-paper-bright); border-bottom:2px solid var(--color-ink); padding:8px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .variant-tab { font-family:var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:.08em; background:none; border:2px solid var(--color-ink); padding:6px 10px; cursor:pointer; color:var(--color-ink); transition:all .15s ease; }
  .variant-tab.active { background:var(--color-ink); color:var(--color-paper); }
  .lang-toggle { margin-left:auto; }
  .variant { display:none; justify-content:center; padding:24px 0; gap:24px; flex-wrap:wrap; }
  .variant.active { display:flex; }

  .phone { width:390px; background:var(--color-paper); border:3px solid var(--color-ink); display:flex; flex-direction:column; }
  .phone .content { height:240px; padding:12px; color:var(--color-faint); font-size:13px; }
  .measure { font-family:var(--font-mono); font-size:11px; color:var(--color-muted); text-align:center; padding:4px; border-top:1px dashed var(--color-faint); }

  .tabbar { background:var(--color-paper-bright); border-top:2px solid var(--color-ink); display:flex; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--color-muted); border:none; border-right:2px solid var(--color-ink); background:none; cursor:pointer; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.06em; transition:all .15s ease; padding:0 2px; min-height:44px; }
  .tab:last-child { border-right:none; }
  .tab.active { background:var(--color-ink); color:var(--color-paper); }
  .tab svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; flex:none; }
  .tab .lbl { font-size:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

  /* A: icons only — 48px tall (vs 64px today) */
  .v-a .tab { height:48px; }
  .v-a .lbl { display:none; }
  /* B: icon + micro label — 56px */
  .v-b .tab { height:56px; }
  /* C: text only, abbreviated FR — 48px */
  .v-c .tab { height:48px; font-size:10px; }
  .v-c .tab svg { display:none; }
</style>
</head>
<body>

<div id="variant-nav">
  <button class="variant-tab active" onclick="showVariant('a', this)">A: Icônes seules</button>
  <button class="variant-tab" onclick="showVariant('b', this)">B: Icône + micro-libellé ★ Selected</button>
  <button class="variant-tab" onclick="showVariant('c', this)">C: Texte abrégé</button>
  <button class="variant-tab lang-toggle" onclick="toggleLang(this)">FR ⇄ EN</button>
</div>

<div id="variant-a" class="variant active"></div>
<div id="variant-b" class="variant"></div>
<div id="variant-c" class="variant"></div>

<div id="sketch-tools" style="position:fixed;bottom:12px;right:12px;z-index:9999;font-family:system-ui;font-size:12px;background:rgba(0,0,0,.7);color:#fff;padding:8px 12px;border-radius:8px;opacity:.4;transition:opacity .2s;" onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='.4'">
  Sketch 015 · toggle FR/EN to stress-test
</div>

<script>
const ICONS = {
  lookup: '<svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><line x1="15" y1="15" x2="21" y2="21"/></svg>',
  drills: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12"/><line x1="8" y1="6" x2="8" y2="14"/><line x1="13" y1="6" x2="13" y2="14"/><line x1="18" y1="6" x2="18" y2="14"/></svg>',
  recall: '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="13" height="16"/><rect x="8" y="3" width="13" height="16"/></svg>',
  songs:  '<svg viewBox="0 0 24 24"><circle cx="7" cy="18" r="3"/><path d="M10 18V5l9-2v12"/><circle cx="16" cy="15" r="3"/></svg>',
  more:   '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>'
};
const LABELS = {
  fr: { lookup:'Recherche', drills:'Exercices', recall:'Révision', songs:'Morceaux', more:'Plus' },
  frAbbr: { lookup:'RECH.', drills:'EXOS', recall:'RÉVIS.', songs:'MORC.', more:'PLUS' },
  en: { lookup:'Lookup', drills:'Drills', recall:'Recall', songs:'Songs', more:'More' },
  enAbbr: { lookup:'LOOK', drills:'DRILL', recall:'RECALL', songs:'SONGS', more:'MORE' }
};
let lang = 'fr';
const KEYS = ['lookup','drills','recall','songs','more'];

function phone(cls, height, note) {
  const labels = cls === 'v-c' ? LABELS[lang + 'Abbr'] : LABELS[lang];
  const tabs = KEYS.map((k, i) =>
    `<button class="tab${k==='recall'?' active':''}" onclick="tap(this)" aria-label="${LABELS[lang][k]}">${ICONS[k]}<span class="lbl">${labels[k]}</span></button>`
  ).join('');
  return `<div class="phone ${cls}">
    <div class="content">Contenu de page… (aujourd'hui la barre fait 64px + libellés français pleins qui débordent)</div>
    <div class="tabbar">${tabs}</div>
    <div class="measure">hauteur barre : ${height} (actuelle : 64px)${note ? ' — ' + note : ''}</div>
  </div>`;
}
function render() {
  document.getElementById('variant-a').innerHTML = phone('v-a','48px','icônes = indépendant de la langue');
  document.getElementById('variant-b').innerHTML = phone('v-b','56px','le micro-libellé enseigne l\'icône');
  document.getElementById('variant-c').innerHTML = phone('v-c','48px','abréviations à valider (RÉVIS. ?)');
}
function tap(el) {
  el.closest('.tabbar').querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}
function toggleLang(btn) { lang = lang === 'fr' ? 'en' : 'fr'; render(); btn.classList.toggle('active'); }
function showVariant(id, tab) {
  document.querySelectorAll('.variant').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.variant-tab:not(.lang-toggle)').forEach(t => t.classList.remove('active'));
  document.getElementById('variant-' + id).classList.add('active');
  tab.classList.add('active');
}
render();
</script>
</body>
</html>
